name: ibraq
description: الإبراق الإلكتروني — تطبيق إداري وفني للموظفين
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  geolocator: ^13.0.2
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/web/
