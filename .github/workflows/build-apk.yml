name: بناء تطبيق الإبراق (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد ملفات أندرويد
        run: flutter create --platforms=android --org com.ibraq --project-name ibraq .

      - name: ضبط الأذونات والإعدادات
        run: python3 tool/patch_android.py

      - name: الحزم والأيقونة
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: توافق الإضافات مع إصدار Gradle الجديد
        run: |
          # بعض الإضافات (مثل flutter_inappwebview_android) ما زالت تستخدم proguard-android.txt
          # والذي لم يعد مدعوماً في Android Gradle Plugin الحديث
          find "$HOME/.pub-cache/hosted" -path '*/android/build.gradle*' -type f \
            -exec sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' {} +

      - name: بناء APK
        run: flutter build apk --release

      - name: نشر رابط التحميل
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: الإبراق الإلكتروني 1.0.${{ github.run_number }}
          body: |
            رابط التحميل الدائم لآخر نسخة:
            https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
