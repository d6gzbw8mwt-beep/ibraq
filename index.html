<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c5a32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الإبراق">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>الإبراق الإلكتروني</title>
<style>
:root{
  --p:#0c5a32; --p2:#167a3e; --pl:#e7f3ea; --a:#e2a72e; --al:#fdf5e2;
  --bg:#f0f2f5; --card:#fff; --tx:#111b21; --mu:#667781; --bd:#e9edef;
  --ok:#2e8b57; --okl:#e5f4ec; --bad:#c0392b; --badl:#fbe9e7; --warn:#b7791f;
  --r:14px; --sh:0 1px 3px rgba(16,40,52,.08),0 4px 14px rgba(16,40,52,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,system-ui,"SF Arabic","Segoe UI",Roboto,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p2)}
#app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12px;opacity:.8;font-weight:400}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
main{flex:1;padding:12px 12px 90px}
main.chatmain{padding:0;display:flex;flex-direction:column;height:calc(100vh - 56px);height:calc(100dvh - 56px - env(safe-area-inset-top))}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.bot .in{display:flex;max-width:720px;width:100%}
nav.bot button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mu);cursor:pointer;position:relative}
nav.bot button .i{font-size:20px;line-height:1}
nav.bot button.on{color:var(--p);font-weight:700}
.dot{position:absolute;top:5px;right:calc(50% - 18px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15.5px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--mu)} .sm{font-size:12.5px} .b{font-weight:700}
.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--p);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--pl);color:var(--p)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.amb{background:var(--a)}
.btn.gh{background:transparent;color:var(--p);border:1px solid var(--bd)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.fab{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:18px;z-index:15;width:54px;height:54px;border-radius:50%;background:var(--a);color:#fff;border:0;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
@media(min-width:760px){.fab{left:calc(50% - 340px)}}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;background:var(--pl);color:var(--p);white-space:nowrap}
.seg.rep{display:flex;gap:4px;flex-wrap:wrap;margin:0}.seg.rep label{flex:1;min-width:64px;text-align:center;padding:9px 4px;border-radius:10px;background:var(--bg,#f0f2f5);cursor:pointer;font-size:14px;border:1px solid transparent}.seg.rep label.on{background:var(--pl,#e6f2ea);color:var(--p);border-color:var(--p);font-weight:700}
.cal{padding:10px}.calhd b{font-size:17px}.ib2{border:0;background:var(--pl);color:var(--p);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cgrid.wk{margin:8px 0 4px}.cgrid.wk div{text-align:center;font-size:11.5px;color:var(--mu,#667)}
.cd{position:relative;border:0;background:transparent;border-radius:10px;padding:5px 1px 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font:inherit;color:inherit}
.cd.empty{cursor:default}.cd .dn{font-size:15px;font-weight:600;width:28px;height:28px;line-height:28px;border-radius:50%;text-align:center}
.cd.today .dn{background:var(--bad,#e53935);color:#fff}.cd.sel{background:var(--pl,#e6f2ea)}.cd.mine{box-shadow:inset 0 0 0 1.5px var(--a)}
.cd .gb{font-size:9.5px;color:#fff;border-radius:6px;padding:1px 4px;white-space:nowrap}.cd .tdot{position:absolute;top:4px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--a)}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.sres{padding:10px 12px;cursor:pointer}.sres mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.tag.urgent{background:var(--badl);color:var(--bad)} .tag.directive{background:var(--al);color:var(--warn)}
.tag.circular{background:#ede7f6;color:#5e35b1} .tag.done{background:var(--okl);color:var(--ok)}
.tag.pend{background:#fff4d6;color:#8a6100} .tag.off{background:#eee;color:#777}
label.f{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu);font-weight:600}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;background:#fff;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--p2);box-shadow:0 0 0 3px var(--pl)}
textarea.in{min-height:80px;resize:vertical}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.list .it:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.av.g{background:var(--p);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.task{border-inline-start:4px solid var(--p2)}
.task.urgent{border-color:var(--bad)} .task.directive{border-color:var(--a)} .task.circular{border-color:#7e57c2} .task.isdone{opacity:.75;border-color:var(--ok)}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.hero .mu{color:rgba(255,255,255,.8)}
.duty-strip{display:flex;gap:6px;margin-top:10px}
.duty-strip div{flex:1;background:rgba(255,255,255,.13);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}
.duty-strip div.on{background:var(--a);color:#fff;font-weight:700}
.stat{flex:1;background:var(--pl);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.stat .n{font-size:22px;font-weight:800;color:var(--p)}
.empty{text-align:center;color:var(--mu);padding:28px 10px}
/* chat */
.msgs{flex:1;overflow-y:auto;padding:12px 10px;background:#eef2f3}
.msg{max-width:82%;margin:4px 0;padding:8px 11px;border-radius:14px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.06);word-wrap:break-word;white-space:pre-wrap}
.msg.me{margin-inline-start:auto;background:#d7efe9;border-end-end-radius:4px}
.msg.ot{border-end-start-radius:4px}
.msg .who{font-size:12px;font-weight:700;color:var(--p2);margin-bottom:2px}
.msg .tm{font-size:10.5px;color:var(--mu);text-align:left;margin-top:2px}
.msg.sys{max-width:92%;margin:8px auto;text-align:center;background:var(--al);color:#6d4c00;font-size:13px}
.msg.sys.urgent{background:var(--badl);color:var(--bad)}
.daysep{text-align:center;margin:10px 0}.daysep span{background:#dde4e7;color:#4d5d66;font-size:11.5px;padding:3px 10px;border-radius:10px}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--bd);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.composer textarea{flex:1;border:1px solid var(--bd);border-radius:20px;padding:9px 14px;resize:none;max-height:110px;min-height:40px;outline:none;background:#f7f9fa}
.cb{width:40px;height:40px;border-radius:50%;border:0;background:var(--pl);color:var(--p);font-size:18px;cursor:pointer;flex:none;display:grid;place-items:center}
.cb.send{background:var(--p);color:#fff}
.cb.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.attchip{display:flex;align-items:center;gap:8px;background:var(--al);padding:6px 10px;font-size:13px}
.recbar{display:flex;align-items:center;gap:10px;background:var(--badl);color:var(--bad);padding:10px 12px;font-weight:700}
.att img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-top:4px;cursor:zoom-in;background:#eee;min-width:60px;min-height:40px}
.att audio{width:230px;max-width:100%;margin-top:4px;height:40px}
.att .fl{display:inline-flex;align-items:center;gap:6px;background:var(--pl);padding:7px 10px;border-radius:10px;margin-top:4px;cursor:pointer;color:var(--p);font-weight:600;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal */
#modal .bg{position:fixed;inset:0;background:rgba(10,25,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media(min-width:700px){#modal .bg{align-items:center}#modal .sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
#modal h2{margin:0 0 6px;font-size:17px}
.imgview{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:grid;place-items:center}
.imgview img{max-width:100%;max-height:100%}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:#1d2d35;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:520px;pointer-events:auto;cursor:pointer;animation:up .2s}
.toast.urgent{background:var(--bad)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth{width:100%;max-width:400px}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:36px;margin:0 auto 10px;box-shadow:var(--sh)}
.notice{background:var(--al);color:#6d4c00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.notice.info{background:var(--pl);color:var(--p)}
#map{height:340px;border-radius:12px;overflow:hidden;background:#dfe7ea}
.spin{width:34px;height:34px;border:4px solid var(--pl);border-top-color:var(--p);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:start}
.seg{display:flex;background:#fff;border-radius:12px;box-shadow:var(--sh);padding:4px;margin-bottom:12px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--p);color:#fff}
.tl{border-inline-start:3px solid var(--bd);margin-inline-start:6px;padding-inline-start:12px}
.sec-title{font-size:13px;color:var(--mu);font-weight:700;margin:16px 4px 8px}

/* ============ تحسينات الواجهة (أسلوب تطبيقات المحادثة) ============ */
svg.ic{width:24px;height:24px;fill:currentColor;display:block}
header.top{background:var(--p);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;min-height:56px;box-shadow:none}
header.top h1{font-size:18px;font-weight:600;letter-spacing:0}
header.top .sub{font-size:12.5px;opacity:.85;margin-top:1px}
.ib{background:transparent;width:40px;height:40px;border-radius:50%;transition:background .15s}
.ib:active{background:rgba(255,255,255,.18)}
.hlogo{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden}
.hlogo img{width:32px;height:32px}
.hav{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.hav svg.ic{width:22px;height:22px}
main.enter{animation:enter .16s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:.55;transform:translate3d(-12px,0,0)}to{opacity:1;transform:none}}
nav.bot{background:#fff;border-top:0;box-shadow:0 -1px 0 var(--bd)}
nav.bot button{padding:7px 2px 8px;font-size:12px;gap:3px;color:#54656f}
nav.bot button .i{display:grid;place-items:center;width:58px;height:30px;border-radius:16px;transition:background .2s}
nav.bot button.on{color:var(--tx);font-weight:700}
nav.bot button.on .i{background:#d8f2df;color:var(--p)}
.dot{top:3px;right:calc(50% - 26px);background:#25a85a;min-width:19px;height:19px;font-weight:700;border:2px solid #fff}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(11,20,26,.08)}
.btn{border-radius:24px;padding:11px 18px;transition:filter .15s,transform .1s}
.btn:active{filter:brightness(.92)}
.btn.sm{border-radius:18px}
.fab{width:58px;height:58px;border-radius:18px;background:#1a9e4b;box-shadow:0 3px 10px rgba(0,0,0,.22);display:grid;place-items:center}
.fab svg.ic{width:26px;height:26px}
.fab:active{transform:scale(.95)}
input.in,select.in,textarea.in{border-radius:12px;padding:11px 13px;background:#fff}
.stat{border-radius:14px}
.logo{width:120px;height:auto;background:none;box-shadow:none;border-radius:0;display:block;margin:0 auto 14px}
.logo img{width:100%;height:auto;display:block}
.it,.chip,.stat,.seg button,nav.bot button{transition:background .15s}
.list .it:active{background:#f5f6f6}
/* قائمة المحادثات */
.clist{background:#fff;margin:-12px -12px 0}
.crow{display:flex;align-items:center;gap:13px;padding:0 16px;cursor:pointer;transition:background .12s}
.crow:active{background:#f5f6f6}
.crow .av{width:50px;height:50px;font-size:17px}
.crow .av svg.ic{width:28px;height:28px}
.crow .bd{flex:1;min-width:0;padding:12px 0;border-bottom:1px solid #f0f2f5}
.crow:last-child .bd{border-bottom:0}
.crow .nm{font-size:16.5px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .lt{font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .tm{font-size:12px;color:var(--mu);flex:none}
.crow.unread .tm{color:#1a9e4b;font-weight:600}
.crow.unread .lt{color:var(--tx);font-weight:500}
.ubadge{background:#25a85a;color:#fff;border-radius:12px;min-width:21px;height:21px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;flex:none}
/* شاشة المحادثة */
.msgs{padding:10px 14px}
.msg{position:relative;max-width:80%;margin:2px 0;padding:6px 9px 7px;border-radius:10px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-size:15.5px;line-height:1.4}
.msg.me{background:#d9fdd3;border-start-end-radius:2px;border-end-end-radius:10px}
.msg.ot{border-start-start-radius:2px;border-end-start-radius:10px}
.msg.me+.msg.me,.msg.ot+.msg.ot{border-start-end-radius:10px;border-start-start-radius:10px}
.msg.me:not(.msg.me+.msg.me),.msg.ot:not(.msg.ot+.msg.ot){margin-top:8px}
.msg.me:not(.msg.me+.msg.me)::before{content:"";position:absolute;top:0;inset-inline-end:-7px;border-width:0 0 10px 8px;border-style:solid;border-color:transparent transparent transparent #d9fdd3;transform:scaleX(-1)}
[dir=rtl] .msg.me:not(.msg.me+.msg.me)::before{border-width:0 8px 10px 0;border-color:transparent #d9fdd3 transparent transparent;transform:none}
.msg.ot:not(.msg.ot+.msg.ot)::before{content:"";position:absolute;top:0;inset-inline-start:-7px;border-width:0 8px 10px 0;border-style:solid;border-color:transparent #fff transparent transparent}
[dir=rtl] .msg.ot:not(.msg.ot+.msg.ot)::before{border-width:0 0 10px 8px;border-color:transparent transparent transparent #fff}
.msg .who{font-size:13px;font-weight:600;color:#1f8a70}
.msg .tm{float:left;font-size:11px;color:#667781;margin:6px 10px -4px 0;line-height:1;position:relative;top:2px}
.msg::after{content:"";display:block;clear:both}
.msg.sys::after{display:none}
.msg.sys{background:#fff7d6;color:#54656f;box-shadow:0 1px .5px rgba(11,20,26,.13);border-radius:8px;font-size:13px;padding:6px 12px}
.msg.sys .tm{float:none;margin:4px 0 0}
.msg.sys::before{display:none}
.daysep span{background:#fff;color:#54656f;font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.composer{border-top:0;padding:6px 8px calc(8px + env(safe-area-inset-bottom));gap:6px;align-items:flex-end}
.cpill{flex:1;display:flex;align-items:flex-end;background:#fff;border-radius:24px;padding:0 4px;box-shadow:0 1px .5px rgba(11,20,26,.13);min-height:48px}
.cpill textarea{flex:1;border:0;background:transparent;padding:13px 6px;min-height:48px;max-height:120px;resize:none;outline:none;font-size:16px;line-height:1.35}
.cpill .cb{background:transparent;color:#54656f;width:40px;height:48px;border-radius:50%}
.cpill .cb svg.ic{width:24px;height:24px}
.cbig{width:48px;height:48px;border-radius:50%;border:0;background:#1a9e4b;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.cbig:active{transform:scale(.94)}
.cbig.rec{background:var(--bad);animation:pulse 1s infinite}
.composer .cbig.send{display:none}
.composer.typing .cbig.send{display:grid}
.composer.typing .cbig.mic{display:none}
.composer.typing .cpill .cam{display:none}
.recui{display:none;flex:1;align-items:center;gap:10px;background:#fff;border-radius:24px;min-height:48px;padding:0 16px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-size:16px;color:var(--tx)}
.composer.recording .cpill{display:none}
.composer.recording .recui{display:flex}
.composer.recording .cbig.send{display:none}
.composer.recording .cbig.mic{transform:scale(1.25);background:var(--bad)}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
.rhint{color:var(--mu);font-size:14px}
.composer.cancel .rhint{color:var(--bad);font-weight:700}
.cbig.mic{touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
/* البصمة الصوتية */
.vn{display:flex;align-items:center;gap:8px;min-width:210px;padding:2px 0 4px}
.vn .pb{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#54656f;display:grid;place-items:center;cursor:pointer;flex:none}
.vn .pb svg.ic{width:30px;height:30px}
.vn .tr{flex:1;height:4px;border-radius:2px;background:#c8d0d3;position:relative;cursor:pointer}

/* تحديث الشاشة بدون إعادة رسمها بالكامل (حركة أنعم وبدون وميض) */
function morph(from, html) { const t = document.createElement(from.tagName); t.innerHTML = html; morphKids(from, t); }
function sameNode(a, b) {
  if (a.nodeType !== b.nodeType) return false; if (a.nodeType !== 1) return true;

const memFiles = new Map();

  return new Promise((res, rej) => {
    try {

/* ---------------- الخلفية: تجريبي (محلي) ---------------- */
function LocalBackend() {
  const KEY = 'dawam_db_v1';
  const load = () => ls.get(KEY, {});

    async init() {},

    async get(col, id) { const d = (db[col] || {})[id]; return d ? {id, ...d} : null; },

    }

}

/* ---------------- ربط الأحداث ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'modalBg') { e.preventDefault(); e.stopPropagation(); }
  Promise.resolve(fn(el.dataset, el, e)).catch(err => { console.error(err); toast(err.message || 'حدث خطأ'); });
});
document.addEventListener('change', e => {
  const inp = e.target;
  if (inp.id === 'pkind') { const t = $('#ptitle'); if (t && /^(موقف|كتاب|ملاحظة)/.test(t.value) || t && !t.value) t.value = inp.value === 'report' ? t.defaultValue : ''; return; }
  if (inp.id === 'utype') { $('#secBox').style.display = inp.value === 'morning' ? '' : 'none'; $('#grpBox').style.display = inp.value === 'shift' ? '' : 'none'; return; } if (inp.dataset && inp.dataset.attach) { const f = inp.files && inp.files[0]; if (f) { if (f.size > MAX_FILE) toast('الحد الأقصى 15 ميغابايت'); else if (/^image\//.test(f.type) && inp.dataset.attach.startsWith('chat:')) openImageEditor(f, inp.dataset.attach); else { S.att[inp.dataset.attach] = f; render(); } } inp.value = ''; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'dmq') { const q = e.target.value.trim(); $$('#modal .it').forEach(it => { it.style.display = it.textContent.includes(q) ? '' : 'none'; }); }
  if (e.target.id === 'docq') { S.params = {...S.params, q: e.target.value}; render(); }
  if (e.target.id === 'mtext') { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; syncComposer(); }
});
function syncComposer() { const c = $('#composer'), t = $('#mtext'); if (!c) return; const tgt = $('[data-act="sendMsg"]', c); const has = (t && t.value.trim()) || (tgt && S.att[tgt.dataset.target]); c.classList.toggle('typing', !!has); }
/* البصمة الصوتية: اضغط مطولاً للتسجيل، ارفع إصبعك للإرسال، اسحب للإلغاء */
const Hold = {on: false, t0: 0, x0: 0, cancel: false, released: false};
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-hold="rec"]'); if (!b || Hold.on) return;
  e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (er) {}
  Hold.on = true; Hold.t0 = Date.now(); Hold.x0 = e.clientX; Hold.cancel = false; Hold.released = false;
  buzz(25); Snd.play('tick');
  Rec.start(b.dataset.target).then(() => { if (Hold.released && Rec.mr) Rec.stop(true); });
});
document.addEventListener('pointermove', e => {
  if (!Hold.on) return; const dx = Math.abs(e.clientX - Hold.x0); const c = $('#composer');
  Hold.cancel = dx > 110; if (c) c.classList.toggle('cancel', dx > 60);
});
const holdEnd = () => {
  if (!Hold.on) return; Hold.on = false; Hold.released = true; const c = $('#composer'); if (c) c.classList.toggle('cancel', false);
  const short = Date.now() - Hold.t0 < 600;
  if (short) { if (Rec.mr) Rec.stop(true); toast('اضغط مطولاً على المايكروفون للتسجيل، وارفع إصبعك للإرسال', {ms: 2200}); return; }
  if (Hold.cancel) { if (Rec.mr) Rec.stop(true); buzz([20, 40, 20]); return; }
  if (Rec.mr) { Rec.stop(false); Snd.play('send'); buzz(15); }
};
document.addEventListener('pointerup', holdEnd);
document.addEventListener('pointercancel', holdEnd);
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'mtext' && e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); const b = $('[data-act="sendMsg"]'); if (b) b.click(); }
});
document.addEventListener('submit', async e => {
  const f = e.target;
  if (f.id === 'loginForm') {
    e.preventDefault(); const fd = new FormData(f); const un = fd.get('username').trim().toLowerCase();
    const u = S.users.find(x => x.username === un);
    const btn = $('button', f); btn.disabled = true;
    try {
      if (!u || (await hashPass(fd.get('pass'), u.salt)) !== u.passHash) return toast('اسم المستخدم أو كلمة المرور غير صحيحة');
      if (u.active === false) return toast('هذا الحساب مغلق — راجع المدير');
      ls.set('dawam_session', {uid: u.id}); login(u);
    } finally { btn.disabled = false; }
  }
  if (f.id === 'setupForm') {
    e.preventDefault(); const fd = new FormData(f); const un = fd.get('username').trim().toLowerCase();
    if (!/^[a-z0-9._-]{3,}$/.test(un)) return toast('اسم المستخدم: 3 أحرف إنكليزية أو أرقام على الأقل');
    await B.set('settings', 'main', {rotStart: ymd(new Date()), rotGroup: 1, shiftHour: 8});
    const pw = await makePass(fd.get('pass')); const id = uid(); ls.set('dawam_session', {uid: id});
    await B.set('users', id, {name: fd.get('name').trim(), username: un, type: 'morning', section: '', role: 'manager', head: false, active: true, job: 'المدير', phone: '', ...pw, created: now()});
    toast('تم إنشاء حساب المدير');
  }
  if (f.id === 'pwForm') {
    e.preventDefault(); const fd = new FormData(f); const me = S.me;
    if ((await hashPass(fd.get('old'), me.salt)) !== me.passHash) return toast('كلمة المرور الحالية غير صحيحة');
    if (fd.get('n1') !== fd.get('n2')) return toast('كلمتا المرور غير متطابقتين');
    await B.update('users', me.id, await makePass(fd.get('n1'))); f.reset(); toast('تم تغيير كلمة المرور ✓');
  }
});

/* ---------------- الاشتراكات المباشرة ---------------- */
let userSubs = [];
function stopUserSubs() { if (SQ.sub) { try { SQ.sub(); } catch (e) {} SQ.sub = null; SQ.all = null; SQ.q = ''; } userSubs.forEach(u => { try { u(); } catch (e) {} }); userSubs = []; S.subs.forEach(u => { try { u(); } catch (e) {} }); S.subs = []; Object.keys(msgSubs).forEach(k => delete msgSubs[k]); Object.keys(commentSubs).forEach(k => delete commentSubs[k]); }
let notifSeen = 0, chatSeen = {};
function login(u) {
  S.me = u; stopUserSubs(); S.view = 'home'; S.params = {}; S.fresh = true;
  notifSeen = ls.get('dawam_nseen_' + u.id, now()); let firstChats = true;
  const sig = {};
  const w = (col, key, extra, views) => userSubs.push(B.watch(col, list => {
    const j = JSON.stringify(list); if (sig[key] === j) return; sig[key] = j;
    S[key] = list; if (extra) extra(list); if (!views || views.includes(S.view)) render();
  }));
  w('tasks', 'tasks'); w('posts', 'posts'); w('requests', 'requests'); w('reports', 'reports'); w('empdocs', 'empdocs');
  if (canLoc(u)) { w('locations', 'locations', null, ['map']); w('attendance', 'attendance', null, ['map']); }
  w('notifs', 'notifs', list => {
    const fresh = list.filter(n => n.ts > notifSeen && n.by !== S.me.id && notifFor(n, S.me)).sort((a, b) => a.ts - b.ts);
    fresh.forEach(n => { if (!n.silentToast || !(S.view === 'chat' && n.link === 'chat:' + S.params.id)) { toast('🔔 ' + n.text, {urgent: n.urgent, ms: n.urgent ? 9000 : 5000, onClick: () => openLink(n.link)}); sysNotify(n.urgent ? '⚠️ تنبيه عاجل' : APP, n.text); } });
    if (fresh.length) { notifSeen = Math.max(...fresh.map(n => n.ts)); ls.set('dawam_nseen_' + S.me.id, notifSeen); }
  }, ['home']);
  w('chats', 'chats', list => {
    list.forEach(c => {
      const prev = chatSeen[c.id] || 0; chatSeen[c.id] = c.lastTs || 0;
      if (firstChats || !c.lastTs || c.lastTs <= prev || c.lastBy === S.me.id || !chatAccess(c.id) || c.id.startsWith('dm_') || c.sys) return;
      if (S.view === 'chat' && S.params.id === c.id) return;
      toast(`💬 ${gName(+c.id.slice(1))} — ${uname(c.lastBy)}: ${c.lastText}`, {onClick: () => go('chat', {id: c.id})});
      sysNotify('محادثة ' + gName(+c.id.slice(1)), `${uname(c.lastBy)}: ${c.lastText}`);
    });
    firstChats = false;
  });
  setTimeout(() => { if (S.me !== u) return; myChats().filter(c => c.lastTs && now() - c.lastTs < 14 * 864e5).sort((a, b) => b.lastTs - a.lastTs).slice(0, 6).forEach(c => { try { watchMsgs(c.id); } catch (e) {} }); }, 2500);
  navStack.length = 0;
  if (onDuty() && shouldBeOnDuty(u)) Geo.start(); else setTimeout(() => { if (S.me === u) Fence.sync(); }, 1500);
  autoDuty();
  render();
}

/* ---------------- الإقلاع ---------------- */
async function boot() {
  try {
    if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId) { S.bootMsg = 'جارِ الاتصال بالخادم…'; render(); B = await FirebaseBackend(window.FIREBASE_CONFIG); }
    else B = LocalBackend();
  } catch (e) {
    console.error(e); $('#app').innerHTML = `<div class="center"><div class="card" style="max-width:420px"><h3>تعذر الاتصال</h3><p class="mu">${esc(e.message)}</p><p class="sm">تأكد من الإنترنت ومن إعدادات Firebase في ملف config.js وتفعيل الدخول المجهول (Anonymous).</p><button class="btn full" id="retryBtn">إعادة المحاولة</button></div></div>`; $('#retryBtn').onclick = () => location.reload(); return;
  }
  await B.init(); S.ready = true;
  B.watch('settings', list => { S.settings = list.find(x => x.id === 'main') || {}; S.settingsLoaded = true; autoDuty(); render(); });
  B.watch('users', list => {
    S.users = list; S.usersLoaded = true;
    const sess = ls.get('dawam_session', null);
    if (S.me) { const fresh = list.find(u => u.id === S.me.id); if (!fresh || fresh.active === false) { toast('تم غلق حسابك أو تغييره'); ls.del('dawam_session'); stopUserSubs(); Geo.stop(); S.me = null; } else S.me = fresh; }
    else if (sess) { const u = list.find(x => x.id === sess.uid && x.active !== false); if (u) { login(u); return; } }
    render();
  });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; toast('تم تثبيت التطبيق ✓'); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoDuty(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
boot();
</script>
